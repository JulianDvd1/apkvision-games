<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420" fill="none">
  <defs>
    <!-- Gradientes de Neón Aura -->
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="neonPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="neonGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luces de fondo ambientales -->
  <circle cx="220" cy="200" r="180" fill="url(#auraGlow)"/>
  <circle cx="1180" cy="210" r="190" fill="url(#purpleGlow)"/>
  <circle cx="700" cy="180" r="160" fill="url(#auraGlow)" opacity="0.6"/>

  <!-- ========================================== -->
  <!-- 1. GAMEPAD MODERNO ERGONÓMICO (IZQUIERDA) -->
  <!-- ========================================== -->
  <g transform="translate(100, 70) rotate(-12)" filter="url(#softGlow)">
    <!-- Cuerpo del Gamepad -->
    <path d="M 40 90 
             C 40 40, 80 20, 140 20 
             C 170 20, 190 35, 210 35 
             C 230 35, 250 20, 280 20 
             C 340 20, 380 40, 380 90 
             C 380 140, 350 230, 305 230 
             C 275 230, 255 180, 210 180 
             C 165 180, 145 230, 115 230 
             C 70 230, 40 140, 40 90 Z" 
          fill="url(#neonGreenGrad)" stroke="#34d399" stroke-width="3" stroke-linejoin="round" opacity="0.85"/>
    
    <!-- Agarre interior / Sombras de relieve -->
    <path d="M 65 100 C 65 140, 85 200, 115 210 C 135 210, 150 175, 185 170" 
          stroke="#064e3b" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 355 100 C 355 140, 335 200, 305 210 C 285 210, 270 175, 235 170" 
          stroke="#064e3b" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- D-Pad (Cruceta Direccional Izquierda) -->
    <path d="M 105 75 h 20 v -20 h 20 v 20 h 20 v 20 h -20 v 20 h -20 v -20 h -20 z" 
          fill="#062e24" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="125,58 135,58 130,50" fill="#34d399"/>
    <polygon points="125,112 135,112 130,120" fill="#34d399"/>
    <polygon points="108,80 108,90 100,85" fill="#34d399"/>
    <polygon points="162,80 162,90 170,85" fill="#34d399"/>

    <!-- Botones de Acción (A, B, X, Y - Derecha) -->
    <!-- Botón Superior (Y) -->
    <circle cx="295" cy="65" r="12" fill="#062e24" stroke="#fbbf24" stroke-width="2"/>
    <text x="295" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">Y</text>
    <!-- Botón Derecho (B) -->
    <circle cx="325" cy="85" r="12" fill="#062e24" stroke="#f43f5e" stroke-width="2"/>
    <text x="325" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f43f5e" text-anchor="middle">B</text>
    <!-- Botón Inferior (A) -->
    <circle cx="295" cy="110" r="12" fill="#062e24" stroke="#34d399" stroke-width="2"/>
    <text x="295" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">A</text>
    <!-- Botón Izquierdo (X) -->
    <circle cx="265" cy="85" r="12" fill="#062e24" stroke="#38bdf8" stroke-width="2"/>
    <text x="265" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">X</text>

    <!-- Sticks Analógicos -->
    <!-- Stick Izquierdo -->
    <circle cx="160" cy="130" r="22" fill="#04211a" stroke="#10b981" stroke-width="3"/>
    <circle cx="160" cy="130" r="14" fill="#0f766e" stroke="#34d399" stroke-width="1.5"/>
    <!-- Stick Derecho -->
    <circle cx="250" cy="135" r="22" fill="#04211a" stroke="#10b981" stroke-width="3"/>
    <circle cx="250" cy="135" r="14" fill="#0f766e" stroke="#34d399" stroke-width="1.5"/>

    <!-- Botón Central Guía Aura ✨ -->
    <circle cx="210" cy="80" r="14" fill="#062e24" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 210 72 Q 210 80 218 80 Q 210 80 210 88 Q 210 80 202 80 Q 210 80 210 72 Z" fill="#38bdf8"/>
    
    <!-- Luces LED Frontales -->
    <circle cx="195" cy="105" r="3" fill="#10b981"/>
    <circle cx="205" cy="105" r="3" fill="#38bdf8"/>
    <circle cx="215" cy="105" r="3" fill="#38bdf8"/>
    <circle cx="225" cy="105" r="3" fill="#10b981"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. AURICULARES GAMING / HEADSET (CENTRO-ARRIBA) -->
  <!-- ============================================== -->
  <g transform="translate(540, 40) rotate(8)" filter="url(#softGlow)">
    <!-- Diadema Superior Acolchada -->
    <path d="M 40 140 C 40 40, 240 40, 240 140" 
          stroke="url(#neonCyanGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 60 130 C 60 55, 220 55, 220 130" 
          stroke="#082f49" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Copa Izquierda -->
    <rect x="20" y="125" width="40" height="75" rx="20" fill="url(#neonCyanGrad)" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="40" cy="162" r="16" fill="#0c4a6e" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="40" cy="162" r="7" fill="#38bdf8"/>

    <!-- Copa Derecha -->
    <rect x="220" y="125" width="40" height="75" rx="20" fill="url(#neonCyanGrad)" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="240" cy="162" r="16" fill="#0c4a6e" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="240" cy="162" r="7" fill="#38bdf8"/>

    <!-- Micrófono Gamer Flotante -->
    <path d="M 35 180 C 35 220, 80 235, 110 220" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <rect x="110" y="210" width="22" height="14" rx="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="127" cy="217" r="3" fill="#10b981"/> <!-- Led de mute/activo verde -->
  </g>

  <!-- ========================================== -->
  <!-- 3. CONSOLA PORTÁTIL NEÓN (CENTRO-DERECHA) -->
  <!-- ========================================== -->
  <g transform="translate(820, 110) rotate(-6)" filter="url(#softGlow)">
    <!-- Cuerpo de la consola -->
    <rect x="0" y="0" width="240" height="125" rx="22" fill="#0f172a" stroke="url(#neonPurpleGrad)" stroke-width="3.5"/>

    <!-- Joy-Con Izquierdo (Acoplado en púrpura) -->
    <path d="M 0 22 C 0 10, 10 0, 22 0 L 45 0 L 45 125 L 22 125 C 10 125, 0 115, 0 103 Z" fill="url(#neonPurpleGrad)" opacity="0.85"/>
    <circle cx="22" cy="40" r="12" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    <circle cx="22" cy="78" r="4" fill="#a855f7"/>
    <circle cx="14" cy="86" r="4" fill="#a855f7"/>
    <circle cx="30" cy="86" r="4" fill="#a855f7"/>
    <circle cx="22" cy="94" r="4" fill="#a855f7"/>

    <!-- Pantalla OLED Central -->
    <rect x="49" y="10" width="142" height="105" rx="8" fill="#030712" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Gráfico en pantalla: Nivel de juego y logo -->
    <path d="M 65 95 L 95 60 L 125 78 L 155 45 L 175 65" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="155" cy="45" r="5" fill="#34d399"/>
    <text x="120" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">AURA 60 FPS</text>

    <!-- Joy-Con Derecho (Acoplado en Cyan/Azul) -->
    <path d="M 195 0 L 218 0 C 230 0, 240 10, 240 22 L 240 103 C 240 115, 230 125, 218 125 L 195 125 Z" fill="url(#neonCyanGrad)" opacity="0.85"/>
    <circle cx="218" cy="85" r="12" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="218" cy="42" r="4" fill="#38bdf8"/>
    <circle cx="210" cy="50" r="4" fill="#38bdf8"/>
    <circle cx="226" cy="50" r="4" fill="#38bdf8"/>
    <circle cx="218" cy="58" r="4" fill="#38bdf8"/>
  </g>

  <!-- ============================================== -->
  <!-- 4. CONTROL ARCADE / JOYSTICK RETRO (DERECHA)   -->
  <!-- ============================================== -->
  <g transform="translate(1120, 95) rotate(10)" filter="url(#softGlow)">
    <!-- Base arcade inclinada 3D -->
    <path d="M 20 60 L 180 50 L 210 170 L 40 185 Z" fill="#111827" stroke="url(#neonGreenGrad)" stroke-width="3"/>
    <path d="M 20 60 L 40 185 L 30 195 L 10 70 Z" fill="#0b101b" stroke="#059669" stroke-width="1.5"/>
    <path d="M 40 185 L 210 170 L 200 180 L 30 195 Z" fill="#0b101b" stroke="#059669" stroke-width="1.5"/>

    <!-- Palanca Stick Arcade Roja/Neón -->
    <circle cx="75" cy="120" r="18" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <line x1="75" y1="120" x2="68" y2="70" stroke="#9ca3af" stroke-width="7" stroke-linecap="round"/>
    <circle cx="66" cy="65" r="17" fill="#ef4444" stroke="#fca5a5" stroke-width="2.5"/>

    <!-- 6 Botones Arcade Multicolor Luminosos -->
    <!-- Fila 1 -->
    <ellipse cx="120" cy="95" rx="10" ry="8" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <ellipse cx="148" cy="90" rx="10" ry="8" fill="#06b6d4" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="176" cy="85" rx="10" ry="8" fill="#8b5cf6" stroke="#c084fc" stroke-width="2"/>
    <!-- Fila 2 -->
    <ellipse cx="125" cy="130" rx="10" ry="8" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
    <ellipse cx="153" cy="125" rx="10" ry="8" fill="#ec4899" stroke="#f472b6" stroke-width="2"/>
    <ellipse cx="181" cy="120" rx="10" ry="8" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  </g>

  <!-- ============================================== -->
  <!-- 5. CONFETI GAMER Y PARTÍCULAS ESPACIALES       -->
  <!-- ============================================== -->
  <!-- Símbolos PlayStation / Gamer (Triángulo, Círculo, Cruz, Cuadrado) -->
  <!-- Triángulos Neón Oro/Verde -->
  <polygon points="50,260 70,295 30,295" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.75" transform="rotate(15 50 260)"/>
  <polygon points="460,80 480,115 440,115" stroke="#10b981" stroke-width="3.5" fill="none" opacity="0.8" transform="rotate(-25 460 80)"/>
  <polygon points="1070,310 1090,345 1050,345" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.7" transform="rotate(45 1070 310)"/>

  <!-- Círculos de Energía Neón -->
  <circle cx="80" cy="50" r="16" stroke="#c084fc" stroke-width="3" fill="none" opacity="0.6"/>
  <circle cx="500" cy="280" r="20" stroke="#38bdf8" stroke-width="3.5" fill="none" opacity="0.7"/>
  <circle cx="760" cy="60" r="14" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.7"/>
  <circle cx="1340" cy="160" r="22" stroke="#34d399" stroke-width="3.5" fill="none" opacity="0.65"/>

  <!-- Cruces (+) Gamer -->
  <g transform="translate(390, 240) rotate(20)" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <line x1="-12" y1="0" x2="12" y2="0"/>
    <line x1="0" y1="-12" x2="0" y2="12"/>
  </g>
  <g transform="translate(740, 320) rotate(-15)" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="-14" y1="0" x2="14" y2="0"/>
    <line x1="0" y1="-14" x2="0" y2="14"/>
  </g>
  <g transform="translate(1330, 290) rotate(35)" stroke="#c084fc" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <line x1="-12" y1="0" x2="12" y2="0"/>
    <line x1="0" y1="-12" x2="0" y2="12"/>
  </g>

  <!-- Cuadrados Gamer Rotados (Rombos) -->
  <rect x="250" y="320" width="22" height="22" rx="4" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.7" transform="rotate(45 261 331)"/>
  <rect x="1020" y="50" width="20" height="20" rx="4" stroke="#10b981" stroke-width="3" fill="none" opacity="0.7" transform="rotate(25 1030 60)"/>

  <!-- Estrellas y Destellos Cósmicos (✨) -->
  <!-- Destello 1 (Grande - Izquierda) -->
  <path d="M 330 40 Q 330 55 345 55 Q 330 55 330 70 Q 330 55 315 55 Q 330 55 330 40 Z" fill="#ffffff" opacity="0.85"/>
  <!-- Destello 2 (Centro) -->
  <path d="M 670 240 Q 670 255 685 255 Q 670 255 670 270 Q 670 255 655 255 Q 670 255 670 240 Z" fill="#38bdf8" opacity="0.9"/>
  <!-- Destello 3 (Derecha) -->
  <path d="M 1250 50 Q 1250 62 1262 62 Q 1250 62 1250 74 Q 1250 62 1238 62 Q 1250 62 1250 50 Z" fill="#fbbf24" opacity="0.85"/>

  <!-- Pequeños puntos estelares flotantes -->
  <circle cx="160" cy="30" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="210" cy="330" r="3" fill="#34d399" opacity="0.7"/>
  <circle cx="430" cy="180" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="610" cy="340" r="3.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="890" cy="40" r="2.5" fill="#c084fc" opacity="0.8"/>
  <circle cx="980" cy="270" r="3" fill="#10b981" opacity="0.75"/>
  <circle cx="1120" cy="360" r="2.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="1270" cy="220" r="3.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="1380" cy="80" r="2.5" fill="#34d399" opacity="0.6"/>
</svg>
