services:
  - type: web
    name: apkvision-hub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SECRET_PATH
        value: /gestion-privada-apk
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        sync: false
